# BlueROV2 R4 — 核心配置 (代码只读此文件,不硬编码参数)
# 带 TODO 的值需在对应 Phase 实测后回填。

connection:
  endpoint: "udpin:0.0.0.0:14550"   # BlueOS 需配一个指向本机 14550 的 UDP Client endpoint
  dialect: "ardupilotmega"
  heartbeat_timeout_s: 10.0
  depth_message: "GLOBAL_POSITION_INT"  # 主: ArduSub 融合深度(relative_alt); 备选: SCALED_PRESSURE2

control:
  CTRL_HZ: 10                       # 主控制循环频率 (Hz)

state:                              # P2 深度状态估计 (2 阶卡尔曼)
  meas_sigma: 0.03                  # m, 深度测量噪声 std (P2 静止标定后回填)
  process_accel_sigma: 0.5          # m/s^2, 过程加速度噪声谱 (KF 调参)
  max_age_s: 0.5                    # 深度超龄阈值 (P4 控制器看门狗使用)

safety:
  U_MAX: 0.3                        # 归一化指令上限 |u| (第一阶段保守值)
  WATCHDOG_MS: 300                  # 超时未发新指令则回中位
  DEPTH_MIN: 0.2                    # m, 向下为正
  DEPTH_MAX: 3.0                    # m, 设为 池深-0.5 左右
  allow_arm: false                  # 是否允许脚本自动解锁 (默认否,需显式确认)

manual_control:                     # <-- Phase 1 干测验证 (2026-09-11)
  z_neutral: 500                    # 已验证:中位→SERVO 1500
  sign_x: 1                         # 轴映射已验证(标准 Heavy);绝对方向待下水确认
  sign_y: 1                         # 轴映射已验证
  sign_z: -1                        # 2026-09-17 水中实测: 原 +1 时上下颠倒 → 改 -1 (现 +u_z=下潜 成立)
  sign_r: 1                         # 轴映射已验证

depth_model:                        # <-- Phase 3 辨识后回填 (二阶模型)
  m_eff: null                       # TODO: 有效质量(含附加质量)
  d_lin: null                       # TODO: 线性阻尼
  d_quad: null                      # TODO: 二次阻尼
  K_u: null                         # TODO: 归一化指令->推力增益
  tau: null                         # (可选) 一阶模型时间常数

pid:                                # <-- Phase 4 调参
  Kp: 3.0
  Ki: 0.5
  Kd: 1.0
  i_limit: 0.3
  u_limit: 0.3

mpc:                                # <-- Phase 5 调参
  dt: 0.1                           # 预测步长 (s)
  N: 20                             # 预测时域步数
  Q_pos: 10.0                       # 深度跟踪权重
  Q_vel: 3.0                        # 深度速率权重 (抑超调)
  R: 0.1                            # 控制量权重
  R_du: 1.0                         # 控制增量权重 (平滑/抗噪)
  u_limit: 0.3                      # 输入约束 |u|
  dist_gain: 0.2                    # 扰动观测器增益 (offset-free;0=关闭)
  delay_comp: 0.15                  # 状态前推补偿延迟 (s;抵消估计滞后+传输)
  solver: "ipopt"
